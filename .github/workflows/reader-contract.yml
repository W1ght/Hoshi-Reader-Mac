name: Reader Contract

on:
  pull_request:
    paths:
      - "NativeMac/**"
      - "Features/Reader/**"
      - "Features/Popup/**"
      - "Features/Dictionary/**"
      - "Core/UserConfig.swift"
      - "Models/**"
      - "script/verify_reader_harness.sh"
      - "script/verify_reader_actual_data_contract.sh"
      - ".github/workflows/reader-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-contract:
    name: Build and verify Reader contracts
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native app
        shell: bash
        run: |
          xcodebuild -quiet \
            -project "Hoshi Reader.xcodeproj" \
            -scheme "Hoshi Reader" \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify Reader contracts
        shell: bash
        run: ./script/verify_reader_harness.sh
