name: Reader Regression

on:
  pull_request:
    paths:
      - "NativeMac/**"
      - "Features/Reader/**"
      - "Features/Popup/**"
      - "Features/Dictionary/**"
      - "Core/UserConfig.swift"
      - "Models/**"
      - "script/capture_reader_regression.sh"
      - "script/generate_reader_fixtures.py"
      - "script/verify_reader_harness.sh"
      - "script/verify_reader_ci_contract.sh"
      - ".github/workflows/reader-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-regression:
    name: Build and verify Reader harness
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native app
        shell: bash
        run: |
          xcodebuild -quiet \
            -project "Hoshi Reader.xcodeproj" \
            -scheme "Hoshi Reader" \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify Reader harness
        shell: bash
        run: ./script/verify_reader_harness.sh

      - name: Create Reader capture plan
        shell: bash
        run: |
          python3 script/generate_reader_fixtures.py \
            --output /tmp/hoshi-reader-ci-fixtures
          bash script/capture_reader_regression.sh \
            --fixtures /tmp/hoshi-reader-ci-fixtures \
            --output artifacts/reader-regression/ci-plan \
            --plan-only

      - name: Upload Reader regression plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-regression-plan
          path: artifacts/reader-regression/ci-plan
          if-no-files-found: error
