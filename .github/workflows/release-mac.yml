name: Release Mac

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.6.0 or 0.6.0-beta"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-mac:
    name: Build and release Mac DMG
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          prerelease="false"
          if [[ "$version" == *-* || "$version" =~ [Bb][Ee][Tt][Aa] ]]; then
            prerelease="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building Hoshi Reader Mac $version"

      - name: Build Light DMG
        shell: bash
        run: script/package_mac.sh "${{ steps.version.outputs.version }}" light

      - name: Build Video DMG
        shell: bash
        run: script/package_mac.sh "${{ steps.version.outputs.version }}" video

      - name: Resolve artifacts
        id: artifacts
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          dmg="release/Hoshi-Reader-Mac-$version.dmg"
          checksum="release/Hoshi-Reader-Mac-$version.sha256"
          video_dmg="release/Hoshi-Reader-Mac-Video-$version.dmg"
          video_checksum="release/Hoshi-Reader-Mac-Video-$version.sha256"
          sha256="$(awk '{print $1}' "$checksum")"
          video_sha256="$(awk '{print $1}' "$video_checksum")"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "video_dmg=$video_dmg" >> "$GITHUB_OUTPUT"
          echo "video_checksum=$video_checksum" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "video_sha256=$video_sha256" >> "$GITHUB_OUTPUT"

      - name: Create release notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          sha256="${{ steps.artifacts.outputs.sha256 }}"
          video_sha256="${{ steps.artifacts.outputs.video_sha256 }}"
          tag="v$version"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          tag_notes="$(git for-each-ref "refs/tags/$tag" --format='%(contents)' | sed '1{/^Hoshi Reader Mac /d;}')"
          cat > "release/release-notes-$version.md" <<EOF
          ## Hoshi Reader Mac $version

          ${tag_notes:-This Mac-focused release includes the latest fixes from the tagged source.}

          ### Install
          This release is an ad-hoc signed native macOS build without a Developer ID signature or notarization.

          Choose the light \`Hoshi-Reader-Mac-$version.dmg\` or the video-enabled \`Hoshi-Reader-Mac-Video-$version.dmg\`, then drag \`Hoshi Reader.app\` to Applications. Both variants use the same app identity and user data. If macOS blocks it, open the app from Finder with right click > Open.

          ### Checksum
          \`Hoshi-Reader-Mac-$version.dmg\`

          SHA256: \`$sha256\`

          \`Hoshi-Reader-Mac-Video-$version.dmg\`

          SHA256: \`$video_sha256\`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          prerelease="${{ steps.version.outputs.prerelease }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "${{ steps.artifacts.outputs.dmg }}" \
              "${{ steps.artifacts.outputs.checksum }}" \
              "${{ steps.artifacts.outputs.video_dmg }}" \
              "${{ steps.artifacts.outputs.video_checksum }}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Hoshi Reader Mac $version" \
              --notes-file "release/release-notes-$version.md" \
              --prerelease="$prerelease"
          else
            gh release create "$tag" \
              "${{ steps.artifacts.outputs.dmg }}" \
              "${{ steps.artifacts.outputs.checksum }}" \
              "${{ steps.artifacts.outputs.video_dmg }}" \
              "${{ steps.artifacts.outputs.video_checksum }}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Hoshi Reader Mac $version" \
              --notes-file "release/release-notes-$version.md" \
              --prerelease="$prerelease" \
              --verify-tag
          fi
