name: Release Mac

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.6.0 or 0.6.0-beta"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-mac:
    name: Build ${{ matrix.name }} DMG
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Light
            variant: light
            artifact: niratan-mac-light
          - name: Video
            variant: video
            artifact: niratan-mac-video
    env:
      HOSHI_RELEASE_SIGNING_IDENTITY: ${{ secrets.HOSHI_RELEASE_SIGNING_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          artifact_mode="standard"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            tag_message="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' || true)"
            if grep -q '^Release-Artifact-Mode: single-dmg$' <<< "$tag_message"; then
              artifact_mode="single-dmg"
            fi
          fi
          prerelease="false"
          if [[ "$version" == *-* || "$version" =~ [Bb][Ee][Tt][Aa] ]]; then
            prerelease="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_mode=$artifact_mode" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building Niratan Mac $version (${{ matrix.variant }}, $artifact_mode)"

      - name: Import release signing certificate
        if: ${{ steps.version.outputs.artifact_mode != 'single-dmg' || matrix.variant == 'light' }}
        shell: bash
        env:
          HOSHI_RELEASE_CERTIFICATE_P12_BASE64: ${{ secrets.HOSHI_RELEASE_CERTIFICATE_P12_BASE64 }}
          HOSHI_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.HOSHI_RELEASE_CERTIFICATE_PASSWORD }}
          HOSHI_RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.HOSHI_RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${HOSHI_RELEASE_CERTIFICATE_P12_BASE64:-}" ]]; then
            if [[ -n "${HOSHI_RELEASE_SIGNING_IDENTITY:-}" ]]; then
              echo "HOSHI_RELEASE_SIGNING_IDENTITY is set, but HOSHI_RELEASE_CERTIFICATE_P12_BASE64 is missing." >&2
              exit 1
            fi
            echo "No release signing certificate secret configured; package_mac.sh will use ad-hoc signing."
            exit 0
          fi
          if [[ -z "${HOSHI_RELEASE_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "HOSHI_RELEASE_CERTIFICATE_PASSWORD is required when importing a release signing certificate." >&2
            exit 1
          fi
          if [[ -z "${HOSHI_RELEASE_SIGNING_IDENTITY:-}" ]]; then
            echo "HOSHI_RELEASE_SIGNING_IDENTITY is required when importing a release signing certificate." >&2
            exit 1
          fi

          keychain_password="${HOSHI_RELEASE_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          keychain_path="$RUNNER_TEMP/niratan-release-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/niratan-release-signing.p12"

          printf '%s' "$HOSHI_RELEASE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$HOSHI_RELEASE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build ${{ matrix.name }} DMG
        if: ${{ steps.version.outputs.artifact_mode != 'single-dmg' || matrix.variant == 'light' }}
        shell: bash
        run: script/package_mac.sh "${{ steps.version.outputs.version }}" "${{ matrix.variant }}"

      - name: Collect ${{ matrix.name }} artifact
        if: ${{ steps.version.outputs.artifact_mode != 'single-dmg' || matrix.variant == 'light' }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          if [[ "${{ steps.version.outputs.artifact_mode }}" == "single-dmg" ]]; then
            artifact="Niratan-Mac-$version"
            mkdir -p "$RUNNER_TEMP/release-artifact"
            cp "release/$artifact.dmg" "$RUNNER_TEMP/release-artifact/niratan.dmg"
            exit 0
          fi
          if [[ "${{ matrix.variant }}" == "video" ]]; then
            artifact="Niratan-Mac-Video-$version"
          else
            artifact="Niratan-Mac-$version"
          fi
          mkdir -p "$RUNNER_TEMP/release-artifact"
          cp "release/$artifact.dmg" "$RUNNER_TEMP/release-artifact/"
          cp "release/$artifact.sha256" "$RUNNER_TEMP/release-artifact/"

      - name: Upload ${{ matrix.name }} artifact
        if: ${{ steps.version.outputs.artifact_mode != 'single-dmg' || matrix.variant == 'light' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/release-artifact/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-mac
    runs-on: ubuntu-latest
    env:
      HOSHI_RELEASE_SIGNING_IDENTITY: ${{ secrets.HOSHI_RELEASE_SIGNING_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          artifact_mode="standard"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            tag_message="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' || true)"
            if grep -q '^Release-Artifact-Mode: single-dmg$' <<< "$tag_message"; then
              artifact_mode="single-dmg"
            fi
          fi
          prerelease="false"
          if [[ "$version" == *-* || "$version" =~ [Bb][Ee][Tt][Aa] ]]; then
            prerelease="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_mode=$artifact_mode" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Publishing Niratan Mac $version ($artifact_mode)"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Resolve artifacts
        id: artifacts
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          if [[ "${{ steps.version.outputs.artifact_mode }}" == "single-dmg" ]]; then
            dmg="release/niratan.dmg"
            [[ -f "$dmg" ]] || {
              echo "Single-DMG release artifact not found: $dmg" >&2
              exit 1
            }
            sha256="$(shasum -a 256 "$dmg" | awk '{print $1}')"
            echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
            echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dmg="release/Niratan-Mac-$version.dmg"
          checksum="release/Niratan-Mac-$version.sha256"
          video_dmg="release/Niratan-Mac-Video-$version.dmg"
          video_checksum="release/Niratan-Mac-Video-$version.sha256"
          sha256="$(awk '{print $1}' "$checksum")"
          video_sha256="$(awk '{print $1}' "$video_checksum")"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "video_dmg=$video_dmg" >> "$GITHUB_OUTPUT"
          echo "video_checksum=$video_checksum" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "video_sha256=$video_sha256" >> "$GITHUB_OUTPUT"

      - name: Create release notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          sha256="${{ steps.artifacts.outputs.sha256 }}"
          video_sha256="${{ steps.artifacts.outputs.video_sha256 }}"
          tag="v$version"
          if [[ -n "${HOSHI_RELEASE_SIGNING_IDENTITY:-}" ]]; then
            signing_note="This release is signed with the configured macOS release certificate but is not notarized."
          else
            signing_note="This release is an ad-hoc signed native macOS build without a Developer ID signature or notarization."
          fi
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          tag_notes="$(git for-each-ref "refs/tags/$tag" --format='%(contents)' | sed '1{/^Niratan Mac /d;}' | sed '/^Release-Artifact-Mode:/d')"
          if [[ "${{ steps.version.outputs.artifact_mode }}" == "single-dmg" ]]; then
            cat > "release/release-notes-$version.md" <<EOF
          ## Niratan Mac $version

          ${tag_notes:-This Mac-focused release includes the latest fixes from the tagged source.}

          ### Install
          $signing_note

          Download \`niratan.dmg\`, then drag \`Niratan.app\` to Applications. If macOS blocks it, open the app from Finder with right click > Open.

          ### Checksum
          \`niratan.dmg\`

          SHA256: \`${{ steps.artifacts.outputs.sha256 }}\`
          EOF
            exit 0
          fi
          cat > "release/release-notes-$version.md" <<EOF
          ## Niratan Mac $version

          ${tag_notes:-This Mac-focused release includes the latest fixes from the tagged source.}

          ### Install
          $signing_note

          Choose the light \`Niratan-Mac-$version.dmg\` or the video-enabled \`Niratan-Mac-Video-$version.dmg\`, then drag \`Niratan.app\` to Applications. Both variants use the same app identity and user data. If macOS blocks it, open the app from Finder with right click > Open.

          ### Checksum
          \`Niratan-Mac-$version.dmg\`

          SHA256: \`$sha256\`

          \`Niratan-Mac-Video-$version.dmg\`

          SHA256: \`$video_sha256\`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          prerelease="${{ steps.version.outputs.prerelease }}"
          if [[ "${{ steps.version.outputs.artifact_mode }}" == "single-dmg" ]]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" \
                "${{ steps.artifacts.outputs.dmg }}" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
              gh release edit "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Niratan Mac $version" \
                --notes-file "release/release-notes-$version.md" \
                --prerelease="$prerelease"
            else
              gh release create "$tag" \
                "${{ steps.artifacts.outputs.dmg }}" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Niratan Mac $version" \
                --notes-file "release/release-notes-$version.md" \
                --prerelease="$prerelease" \
                --verify-tag
            fi
            exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "${{ steps.artifacts.outputs.dmg }}" \
              "${{ steps.artifacts.outputs.checksum }}" \
              "${{ steps.artifacts.outputs.video_dmg }}" \
              "${{ steps.artifacts.outputs.video_checksum }}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Niratan Mac $version" \
              --notes-file "release/release-notes-$version.md" \
              --prerelease="$prerelease"
          else
            gh release create "$tag" \
              "${{ steps.artifacts.outputs.dmg }}" \
              "${{ steps.artifacts.outputs.checksum }}" \
              "${{ steps.artifacts.outputs.video_dmg }}" \
              "${{ steps.artifacts.outputs.video_checksum }}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Niratan Mac $version" \
              --notes-file "release/release-notes-$version.md" \
              --prerelease="$prerelease" \
              --verify-tag
          fi
